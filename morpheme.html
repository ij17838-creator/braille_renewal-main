<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>형태소 & 낱말 점자 퀴즈 (Morpheme Braille Quiz)</title>
  <meta name="theme-color" content="#0f172a">
  
  <!-- Tailwind CSS & Tone.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --braille-dot-size: 0.35em;
      --braille-cell-gap: 0.16em;
      --braille-word-gap: 0.45em;
      --target-word-size: 2.6rem;
    }

    body.text-scale-normal { --target-word-size: 2.6rem; }
    body.text-scale-large { --target-word-size: 3.2rem; }
    body.text-scale-xlarge { --target-word-size: 3.9rem; }

    #target-prompt-text { font-size: var(--target-word-size) !important; line-height: 1.2; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body.accessible-font {
      font-family: 'Noto Sans KR', sans-serif !important;
      letter-spacing: 0.04em !important;
      line-height: 1.6 !important;
    }

    body.focus-ring-enhanced :focus-visible,
    body.focus-ring-enhanced button:focus {
      outline: 4px solid #facc15 !important;
      outline-offset: 3px !important;
      box-shadow: 0 0 0 7px rgba(15, 23, 42, 0.95), 0 0 16px 2px rgba(250, 204, 21, 0.7) !important;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(226, 232, 240, 0.85);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .glass-card:hover:not(:disabled) {
      background: rgba(255, 255, 255, 1);
      transform: translateY(-4px) scale(1.015);
      border-color: #6366f1;
      box-shadow: 0 14px 28px -6px rgba(99, 102, 241, 0.22);
    }

    /* 고대비 색상 팔레트 모듈 */
    :root[data-theme="hc-yellow"] {
      --hc-bg: #000000;
      --hc-text: #ffff00;
      --hc-border: #ffff00;
      --hc-accent: #00ffff;
      --hc-disabled: #9ca3af;
    }
    :root[data-theme="hc-white-black"] {
      --hc-bg: #000000;
      --hc-text: #ffffff;
      --hc-border: #ffffff;
      --hc-accent: #38bdf8;
      --hc-disabled: #a3a3a3;
    }
    :root[data-theme="hc-black-white"] {
      --hc-bg: #ffffff;
      --hc-text: #000000;
      --hc-border: #000000;
      --hc-accent: #0047ab;
      --hc-disabled: #525252;
    }
    :root[data-theme="hc-amber"] {
      --hc-bg: #090a0f;
      --hc-text: #fde047;
      --hc-border: #facc15;
      --hc-accent: #67e8f9;
      --hc-disabled: #94a3b8;
    }

    /* 고대비 모드 공통 테두리 및 포커스 스타일 */
    .hc-element {
      background-color: var(--hc-bg);
      color: var(--hc-text);
      border: 2px solid var(--hc-border);
    }
    .hc-element:focus-visible {
      outline: 3px solid var(--hc-accent);
      outline-offset: 2px;
    }

    /* 고대비 테마 일괄 적용 오버라이드 */
    :root[data-theme] body {
      background-color: var(--hc-bg) !important;
      color: var(--hc-text) !important;
    }
    :root[data-theme] #app-bg-gradient,
    :root[data-theme] #bg-gradient {
      display: none !important;
    }
    :root[data-theme] .glass-panel,
    :root[data-theme] .glass-card,
    :root[data-theme] .glass-button {
      background-color: var(--hc-bg) !important;
      color: var(--hc-text) !important;
      border: 2px solid var(--hc-border) !important;
    }
    :root[data-theme] button {
      background-color: var(--hc-bg) !important;
      color: var(--hc-text) !important;
      border: 2px solid var(--hc-border) !important;
    }
    :root[data-theme] button:hover:not(:disabled) {
      background-color: var(--hc-text) !important;
      color: var(--hc-bg) !important;
      border-color: var(--hc-accent) !important;
    }
    :root[data-theme] button:hover:not(:disabled) * {
      color: var(--hc-bg) !important;
    }
    :root[data-theme] div,
    :root[data-theme] p,
    :root[data-theme] span,
    :root[data-theme] h1,
    :root[data-theme] h2,
    :root[data-theme] h3,
    :root[data-theme] h4,
    :root[data-theme] label,
    :root[data-theme] li,
    :root[data-theme] svg {
      color: var(--hc-text) !important;
      border-color: var(--hc-border) !important;
    }
    :root[data-theme] .braille-cell {
      border: 1.5px solid var(--hc-border) !important;
    }
    :root[data-theme] .braille-dot.active {
      background-color: var(--hc-text) !important;
    }
    :root[data-theme] .braille-dot.inactive {
      background-color: transparent !important;
      border: 1.5px solid var(--hc-border) !important;
    }

    /* 점자 그리드 스타일 */
    .braille-word { display: inline-flex; gap: var(--braille-word-gap); align-items: center; justify-content: center; flex-wrap: wrap; }
    .braille-cell { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: var(--braille-cell-gap); padding: 0.12em; border-radius: 0.2em; }
    .braille-dot { width: var(--braille-dot-size); height: var(--braille-dot-size); border-radius: 50%; box-sizing: border-box; }
    .braille-dot.active { background-color: currentColor; }
    .braille-dot.inactive { background-color: rgba(148, 163, 184, 0.3); }

    @keyframes card-pop { 0% { transform: scale(0.98); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    @keyframes card-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .animate-card-pop { animation: card-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .animate-card-shake { animation: card-shake 0.4s ease-in-out; }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 8px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 h-[100dvh] w-screen relative text-scale-normal focus-ring-enhanced">

  <div id="bg-gradient" class="absolute top-0 left-0 w-full h-full z-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900"></div>

  <!-- 보조공학 스크린리더 라이브 리전 -->
  <div id="a11y-live-region" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <div class="relative z-20 w-full h-full flex flex-col items-center justify-center p-3 sm:p-5">
    
    <main class="glass-panel shadow-2xl rounded-3xl w-full max-w-4xl flex flex-col h-[95%] max-h-[850px] overflow-hidden">
      
      <!-- 1. 헤더 영역 -->
      <header class="flex justify-between items-center p-4 border-b border-white/50 bg-white/40 shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black shadow-md text-xl">
            🧩
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-black text-slate-800 tracking-tight">형태소 & 낱말 점자 퀴즈</h1>
              <span id="badge-combo-title" class="px-2.5 py-0.5 rounded-full text-xs font-black bg-indigo-100 text-indigo-800 border border-indigo-300">
                점자 입문자
              </span>
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-500 font-bold mt-0.5">
              <span id="label-mode-info">Level 1 · KO · 낱말 매칭</span>
              <span>·</span>
              <span class="text-indigo-600 font-black" id="combo-counter">연속 0콤보</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- 음성 힌트 재생 버튼 -->
          <button id="btn-hint" class="p-2 rounded-xl bg-white/90 hover:bg-white text-slate-700 hover:text-indigo-600 border border-slate-200 transition-all shadow-sm" title="음성 힌트 듣기 (단축키 R)" aria-label="문제 음성 힌트 듣기">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          </button>
          <!-- 취약 유형 모달 토글 -->
          <button id="btn-open-weakness" class="px-3 py-1.5 rounded-xl bg-white/90 hover:bg-white border border-slate-200 font-bold text-xs flex items-center gap-1.5 transition-all shadow-sm">
            <span>취약 분석</span>
            <span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
          </button>
          <!-- 메인 허브 이동 -->
          <button id="btn-go-hub" class="p-2 rounded-xl bg-white/90 hover:bg-white text-slate-700 hover:text-indigo-600 border border-slate-200 transition-all shadow-sm" title="메인 허브로 이동" aria-label="메인 허브로 이동">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </button>
          <!-- 환경 설정 -->
          <button id="btn-settings" class="p-2 rounded-xl bg-white/90 hover:bg-white text-slate-700 hover:text-indigo-600 border border-slate-200 transition-all shadow-sm" title="환경 및 접근성 설정" aria-label="환경 및 접근성 설정 열기">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
        </div>
      </header>

      <!-- 2. 중앙 문제 화면 -->
      <section class="p-4 sm:p-5 flex flex-col items-center justify-center shrink-0 border-b border-white/40 bg-white/20">
        <div class="flex items-center gap-2 mb-1">
          <span id="prompt-category" class="text-[11px] font-black uppercase tracking-wider text-indigo-700 bg-indigo-100 px-3 py-0.5 rounded-full border border-indigo-200">
            기초 약자
          </span>
          <span id="prompt-type-label" class="text-[11px] font-bold text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-full border border-slate-200">
            약자 음절
          </span>
        </div>
        
        <h2 id="target-prompt-text" class="font-black text-slate-900 tracking-tight text-center my-1 break-all">
          나
        </h2>

        <p id="target-prompt-hint" class="text-xs sm:text-sm text-slate-600 font-semibold text-center max-w-lg">
          제시된 낱말/부호에 해당하는 올바른 점자 카드를 고르세요.
        </p>
      </section>

      <!-- 3. 4지선다 카드 그리드 -->
      <section class="flex-1 p-4 sm:p-6 overflow-y-auto custom-scrollbar flex items-center justify-center">
        <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-3xl"></div>
      </section>

      <!-- 4. 하단 키보드 가이드 -->
      <footer class="p-3 sm:p-4 border-t border-white/60 bg-slate-50/90 rounded-b-3xl shrink-0 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-semibold text-slate-500">
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 bg-slate-200 rounded text-slate-700 font-mono font-black">[1]~[4]</span>
          <span>숫자 키로 즉시 카드 선택 가능</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>json 데이터 직접 연동 (단독 실행)</span>
        </div>
      </footer>

    </main>
  </div>

  <!-- 취약점 대시보드 모달 -->
  <div id="weakness-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden">
    <div class="glass-panel rounded-3xl p-5 sm:p-6 max-w-lg w-full shadow-2xl relative z-10 m-4 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center pb-3 border-b border-slate-200">
        <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
          📊 취약 어휘/유형 분석 대시보드
        </h3>
        <button id="btn-close-weakness" class="text-slate-400 hover:text-slate-700 p-1" aria-label="닫기">✕</button>
      </div>

      <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 py-4 flex flex-col gap-4">
        <div class="bg-rose-50 p-4 rounded-2xl border border-rose-200">
          <h4 class="text-xs font-bold text-rose-700 uppercase tracking-wider mb-2">오답 데이터 기반 취약 유형 Top 3</h4>
          <ul id="weakness-list" class="flex flex-col gap-2"></ul>
        </div>
      </div>

      <div class="pt-3 border-t border-slate-200">
        <button id="btn-retry-weakness" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-sm">
          취약 유형 집중 복습 문제 출제
        </button>
      </div>
    </div>
  </div>

  <!-- 환경 및 접근성 설정 모달 -->
  <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden" role="dialog" aria-modal="true">
    <div class="glass-panel rounded-3xl p-5 sm:p-6 max-w-md w-full shadow-2xl relative z-10 m-4 flex flex-col gap-4">
      <div class="flex justify-between items-center pb-2.5 border-b border-slate-200">
        <h3 class="text-lg font-black text-slate-800">환경 및 접근성 설정</h3>
        <button id="btn-settings-close" class="text-slate-400 hover:text-slate-700 p-1">✕</button>
      </div>

      <div class="flex flex-col gap-3">
        <!-- 고대비 테마 -->
        <div>
          <span class="text-xs font-bold text-slate-600 block mb-1">고대비 테마 프리셋</span>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" class="theme-btn py-2 rounded-xl border text-xs font-bold bg-white text-slate-800" data-theme="hc-yellow">옐로우 온 블랙</button>
            <button type="button" class="theme-btn py-2 rounded-xl border text-xs font-bold bg-white text-slate-800" data-theme="hc-white-black">화이트 온 블랙</button>
            <button type="button" class="theme-btn py-2 rounded-xl border text-xs font-bold bg-white text-slate-800" data-theme="hc-black-white">블랙 온 화이트</button>
            <button type="button" class="theme-btn py-2 rounded-xl border text-xs font-bold bg-white text-slate-800" data-theme="hc-amber">앰버 네온</button>
          </div>
        </div>

        <!-- 텍스트 크기 -->
        <div>
          <span class="text-xs font-bold text-slate-600 block mb-1">텍스트 크기</span>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" class="scale-btn py-2 rounded-xl text-xs font-bold border bg-emerald-500 text-white" data-scale="normal">1.0x</button>
            <button type="button" class="scale-btn py-2 rounded-xl text-xs font-bold border bg-white text-slate-700" data-scale="large">1.25x</button>
            <button type="button" class="scale-btn py-2 rounded-xl text-xs font-bold border bg-white text-slate-700" data-scale="xlarge">1.5x</button>
          </div>
        </div>

        <!-- TTS 및 음향 -->
        <div class="bg-teal-50/70 p-3 rounded-xl border border-teal-200 flex flex-col gap-2 text-xs">
          <label class="flex items-center justify-between font-bold text-slate-700">
            <span>TTS 음성 안내</span>
            <input type="checkbox" id="chk-tts" class="w-4 h-4 accent-emerald-500" checked>
          </label>
          <label class="flex items-center justify-between font-bold text-slate-700">
            <span>도·레·미 음계 비프음</span>
            <input type="checkbox" id="chk-pitch" class="w-4 h-4 accent-emerald-500" checked>
          </label>
        </div>
      </div>

      <button id="btn-save-settings" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-sm mt-1">
        설정 저장 및 닫기
      </button>
    </div>
  </div>

  <script type="module">
    // 1. 상태 객체
    const urlParams = new URLSearchParams(window.location.search);

    const appState = {
      lang: urlParams.get('lang') || localStorage.getItem('braille_lang') || 'KO',
      level: parseInt(urlParams.get('level') || localStorage.getItem('braille_level') || '1'),
      combo: 0,
      currentQuiz: null,
      isAnsweringLocked: false,
      dataset: [],
      quizIndex: 0,
      theme: localStorage.getItem('braille_theme') || 'off',
      scale: localStorage.getItem('braille_text_scale') || 'normal',
      tts: localStorage.getItem('braille_tts') !== 'false',
      pitch: localStorage.getItem('braille_pitch') !== 'false'
    };

    // 2. 오디오 엔진
    let synthAudio, sfxCorrect, sfxWrong;
    async function initAudio() {
      if (synthAudio) return;
      await Tone.start();
      synthAudio = new Tone.PolySynth(Tone.Synth).toDestination();
      sfxCorrect = new Tone.Synth({ oscillator: { type: "triangle" } }).toDestination();
      sfxWrong = new Tone.MembraneSynth().toDestination();
    }

    function playSound(type) {
      if (!synthAudio) return;
      if (type === 'hover') synthAudio.triggerAttackRelease("E5", "64n");
      else if (type === 'correct') {
        sfxCorrect.triggerAttackRelease("G5", "16n");
        setTimeout(() => sfxCorrect.triggerAttackRelease("C6", "16n"), 130);
      } else if (type === 'wrong') sfxWrong.triggerAttackRelease("C2", "8n");
    }

    function speak(text) {
      if (!appState.tts || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = appState.lang === 'KO' ? 'ko-KR' : 'en-US';
      document.getElementById('a11y-live-region').textContent = text;
      window.speechSynthesis.speak(ut);
    }

    // 3. 점자 DOM 렌더러
    function renderBrailleHTML(text) {
      let html = `<div class="braille-word text-3xl">`;
      for (let i = 0; i < text.length; i++) {
        const charCode = text.charCodeAt(i);
        if (charCode >= 0x2800 && charCode <= 0x28FF) {
          const pattern = charCode - 0x2800;
          html += `<div class="braille-cell">`;
          const bits = [
            (pattern & 0x01) > 0, (pattern & 0x08) > 0,
            (pattern & 0x02) > 0, (pattern & 0x10) > 0,
            (pattern & 0x04) > 0, (pattern & 0x20) > 0
          ];
          bits.forEach(on => html += `<div class="braille-dot ${on ? 'active' : 'inactive'}"></div>`);
          html += `</div>`;
        } else {
          html += `<span class="font-bold mx-1 text-xl">${text[i]}</span>`;
        }
      }
      return html + `</div>`;
    }

    // 4. JSON 데이터 로더
    async function loadQuizDataset() {
      try {
        const res = await fetch('morpheme_words.json');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const pool = data[appState.lang] || data.KO;
        appState.dataset = pool.filter(q => q.level <= appState.level);
        if (appState.dataset.length === 0) appState.dataset = pool;
      } catch (e) {
        console.warn("morpheme_words.json 로드 실패 fallback 가동");
        appState.dataset = [
          { category: "기초 약자", type_label: "기초 음절", target_text: "나", target_braille: "⠉", distractors_braille: ["⠁", "⠃", "⠙"], hint: "초성 ㄴ과 모음 ㅏ가 결합한 약자 '나'입니다." },
          { category: "단어 약어", type_label: "접속어 약어", target_text: "그리고", target_braille: "⠁⠥", distractors_braille: ["⠁⠕", "⠁⠢", "⠉⠥"], hint: "접속어 '그리고'의 단독 약자입니다." }
        ];
      }
      renderNextQuiz();
    }

    // 5. 퀴즈 바인딩
    function renderNextQuiz() {
      if (appState.dataset.length === 0) return;
      const q = appState.dataset[appState.quizIndex % appState.dataset.length];
      appState.quizIndex++;
      appState.currentQuiz = q;
      appState.isAnsweringLocked = false;

      document.getElementById('label-mode-info').textContent = `Level ${appState.level} · ${appState.lang} · 낱말 매칭`;
      document.getElementById('prompt-category').textContent = q.category || '낱말 퀴즈';
      document.getElementById('prompt-type-label').textContent = q.type_label || '약자/약어';
      document.getElementById('target-prompt-text').textContent = q.target_text;
      document.getElementById('target-prompt-hint').textContent = q.hint || `${q.target_text}에 해당하는 올바른 점자 카드를 선택하세요.`;

      let options = [{ braille: q.target_braille, isCorrect: true }];
      if (Array.isArray(q.distractors_braille)) {
        options.push(...q.distractors_braille.map(b => ({ braille: b, isCorrect: false })));
      }
      options = options.slice(0, 4);
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }
      appState.currentQuiz.options = options;

      renderCards(options);
      speak(`문제: ${q.target_text}. ${q.hint || ''}. 올바른 점자 카드를 선택하세요.`);
    }

    function renderCards(options) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      options.forEach((opt, idx) => {
        const cardBtn = document.createElement('button');
        cardBtn.className = 'glass-card rounded-2xl p-5 flex flex-col items-center justify-between min-h-[140px] relative group text-slate-800 shadow-md focus:ring-4';
        cardBtn.setAttribute('data-index', idx);
        cardBtn.setAttribute('aria-label', `${idx + 1}번 선택지 점자 카드`);

        cardBtn.innerHTML = `
          <div class="w-full flex justify-between items-center text-xs font-mono font-bold text-slate-400 group-hover:text-indigo-600 transition-colors">
            <span class="px-2 py-0.5 rounded-md bg-slate-100/90 border border-slate-200">[${idx + 1}번]</span>
            <span class="text-[11px] font-semibold text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity">선택하기 ↵</span>
          </div>
          <div class="my-auto py-2">
            ${renderBrailleHTML(opt.braille)}
          </div>
          <div class="w-full text-center text-[11px] font-semibold text-slate-400">
            점자 카드를 고르세요
          </div>
        `;

        cardBtn.addEventListener('mouseenter', () => playSound('hover'));
        cardBtn.addEventListener('click', () => handleSelectOption(opt, cardBtn));

        grid.appendChild(cardBtn);
      });
    }

    // 6. 판정 및 통계 기록
    function handleSelectOption(option, cardElement) {
      if (appState.isAnsweringLocked) return;
      appState.isAnsweringLocked = true;
      initAudio();

      const allCards = document.querySelectorAll('#card-grid button');

      if (option.isCorrect) {
        playSound('correct');
        appState.combo++;
        updateTitleBadge();
        speak(`정답입니다! 연속 ${appState.combo}콤보 달성.`);

        cardElement.classList.add('animate-card-pop', 'border-emerald-500', 'bg-emerald-50/90');
        allCards.forEach(c => c.disabled = true);

        recordStat(true);
        setTimeout(renderNextQuiz, 1100);
      } else {
        playSound('wrong');
        appState.combo = 0;
        updateTitleBadge();
        speak("오답입니다. 올바른 점형을 확인하세요.");

        cardElement.classList.add('animate-card-shake', 'border-rose-500', 'bg-rose-50/90');
        allCards.forEach((c, i) => {
          if (appState.currentQuiz.options[i] && appState.currentQuiz.options[i].isCorrect) {
            c.classList.add('border-emerald-500', 'bg-emerald-50/50');
          }
        });

        recordStat(false);
        setTimeout(() => {
          appState.isAnsweringLocked = false;
          cardElement.classList.remove('animate-card-shake');
          allCards.forEach(c => c.disabled = false);
        }, 1200);
      }
    }

    function recordStat(isCorrect) {
      const q = appState.currentQuiz;
      if (!q) return;
      const typeKey = q.category || q.type_label || '낱말 점자';

      const ruleStats = JSON.parse(localStorage.getItem('braille_rule_stats') || '{}');
      if (!ruleStats[typeKey]) ruleStats[typeKey] = { errors: 0, trials: 0, games: {} };
      ruleStats[typeKey].trials = (ruleStats[typeKey].trials || 0) + 1;
      if (!isCorrect) {
        ruleStats[typeKey].errors = (ruleStats[typeKey].errors || 0) + 1;
        if (!ruleStats[typeKey].games) ruleStats[typeKey].games = {};
        ruleStats[typeKey].games['morpheme'] = (ruleStats[typeKey].games['morpheme'] || 0) + 1;
      }
      localStorage.setItem('braille_rule_stats', JSON.stringify(ruleStats));
    }

    function updateTitleBadge() {
      document.getElementById('combo-counter').textContent = `연속 ${appState.combo}콤보`;
      const titleBadge = document.getElementById('badge-combo-title');
      if (appState.combo >= 8) titleBadge.textContent = "점자 달인";
      else if (appState.combo >= 4) titleBadge.textContent = "숙련 탐색가";
      else titleBadge.textContent = "점자 입문자";
    }

    // 7. 이벤트 바인딩
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (appState.isAnsweringLocked) return;
      const num = parseInt(e.key);
      if (num >= 1 && num <= 4 && appState.currentQuiz && appState.currentQuiz.options) {
        const option = appState.currentQuiz.options[num - 1];
        const cardBtns = document.querySelectorAll('#card-grid button');
        if (option && cardBtns[num - 1]) {
          handleSelectOption(option, cardBtns[num - 1]);
          e.preventDefault();
        }
      } else if (e.key === 'r' || e.key === 'R') {
        document.getElementById('btn-hint').click();
      }
    });

    document.getElementById('btn-hint').onclick = () => {
      if (appState.currentQuiz) speak(`문제: ${appState.currentQuiz.target_text}. 힌트: ${appState.currentQuiz.hint || ''}`);
    };

    document.getElementById('btn-go-hub').onclick = () => {
      const params = new URLSearchParams({
        lang: appState.lang,
        level: appState.level.toString()
      });
      window.location.href = `front_end.html?${params.toString()}`;
    };

    // 설정 모달
    const settingsModal = document.getElementById('settings-modal');
    document.getElementById('btn-settings').onclick = () => settingsModal.classList.remove('hidden');
    document.getElementById('btn-settings-close').onclick = () => settingsModal.classList.add('hidden');
    document.getElementById('btn-save-settings').onclick = () => {
      appState.tts = document.getElementById('chk-tts').checked;
      appState.pitch = document.getElementById('chk-pitch').checked;
      localStorage.setItem('braille_tts', appState.tts.toString());
      localStorage.setItem('braille_pitch', appState.pitch.toString());
      settingsModal.classList.add('hidden');
      applyVisualSettings();
    };

    // 취약 모달
    const weaknessModal = document.getElementById('weakness-modal');
    document.getElementById('btn-open-weakness').onclick = () => {
      const stats = JSON.parse(localStorage.getItem('braille_rule_stats') || '{}');
      const sorted = Object.entries(stats)
        .filter(([k, v]) => v.errors > 0)
        .sort((a, b) => b[1].errors - a[1].errors)
        .slice(0, 3);

      const list = document.getElementById('weakness-list');
      if (sorted.length === 0) {
        list.innerHTML = '<li class="text-xs text-slate-400 py-2 text-center">누적 오답 기록이 없습니다.</li>';
      } else {
        list.innerHTML = sorted.map(([k, v]) => `
          <li class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-rose-100 text-xs font-bold">
            <span class="text-slate-700">${k}</span>
            <span class="text-rose-600 font-mono">${v.errors}회 오답</span>
          </li>
        `).join('');
      }
      weaknessModal.classList.remove('hidden');
    };
    document.getElementById('btn-close-weakness').onclick = () => weaknessModal.classList.add('hidden');
    document.getElementById('btn-retry-weakness').onclick = () => {
      weaknessModal.classList.add('hidden');
      renderNextQuiz();
    };

    function normalizeTheme(theme) {
      if (theme === 'yellow') return 'hc-yellow';
      if (theme === 'bw') return 'hc-white-black';
      return theme;
    }

    function applyVisualSettings() {
      const b = document.body;
      b.classList.remove('text-scale-normal', 'text-scale-large', 'text-scale-xlarge');
      
      const theme = normalizeTheme(appState.theme);
      if (theme && theme !== 'off') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }

      b.classList.add(`text-scale-${appState.scale}`);
    }

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.onclick = () => {
        const t = btn.dataset.theme;
        appState.theme = (appState.theme === t) ? 'off' : t;
        localStorage.setItem('braille_theme', appState.theme);
        applyVisualSettings();
      };
    });

    document.querySelectorAll('.scale-btn').forEach(btn => {
      btn.onclick = () => {
        appState.scale = btn.dataset.scale;
        localStorage.setItem('braille_text_scale', appState.scale);
        applyVisualSettings();
      };
    });

    // 초기화
    applyVisualSettings();
    loadQuizDataset();
  </script>
</body>
</html>
